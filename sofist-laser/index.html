<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Painel — Sofist Laser</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #F7F1E6;
    --paper: #FFFDF9;
    --ink: #2B1B12;
    --ink-soft: #6B5A4E;
    --gold: #B9862E;
    --gold-deep: #8C6420;
    --line: #E4D8C4;
    --danger: #A4442E;
    --success: #4C6B47;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--ink);
    color: var(--bg);
    padding: 16px 18px 0;
  }
  header .brand {
    font-family: Georgia, "Iowan Old Style", serif;
    font-size: 22px;
    letter-spacing: 0.3px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  header .brand small {
    font-family: -apple-system, sans-serif;
    font-size: 12px;
    color: var(--gold);
    font-weight: 600;
  }
  .attendant-row {
    margin-top: 10px;
    display: flex;
    gap: 8px;
  }
  .attendant-row input {
    flex: 1;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    color: var(--bg);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
  }
  .attendant-row input::placeholder { color: rgba(247,241,230,0.5); }

  /* Abas principais (Funil / Dashboard) */
  .main-tabs {
    display: flex;
    gap: 4px;
    margin-top: 14px;
  }
  .main-tab {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    background: transparent;
    border: none;
    color: rgba(247,241,230,0.55);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .main-tab.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }

  .view-toggle {
    display: flex;
    gap: 6px;
    padding: 10px 14px 0;
  }
  .view-btn {
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .view-btn.active {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  main { padding: 14px; padding-bottom: 30px; }

  .empty {
    text-align: center;
    color: var(--ink-soft);
    padding: 60px 20px;
    font-size: 14px;
  }

  /* Kanban */
  .board {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    align-items: flex-start;
    padding-bottom: 10px;
    scroll-snap-type: x proximity;
  }
  .column {
    flex: 0 0 82vw;
    max-width: 320px;
    scroll-snap-align: start;
    background: rgba(43,27,18,0.03);
    border: 1px solid var(--line);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 190px);
  }
  @media (min-width: 700px) {
    .column { flex: 1 1 0; max-width: none; }
  }
  .column-header {
    padding: 12px 14px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: var(--bg);
    border-radius: 14px 14px 0 0;
  }
  .column-header .name {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .column-header .count {
    background: var(--ink);
    color: var(--bg);
    border-radius: 999px;
    padding: 1px 8px;
    font-size: 11px;
    font-weight: 700;
  }
  .column-body { padding: 10px; overflow-y: auto; flex: 1; }
  .column-empty {
    text-align: center;
    color: var(--ink-soft);
    font-size: 12px;
    padding: 24px 10px;
    opacity: 0.7;
  }

  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
    box-shadow: 0 1px 2px rgba(43,27,18,0.06);
  }
  .card.clicavel { cursor: pointer; }
  .card.clicavel:active { background: #F4EBDB; }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .phone { font-size: 14px; font-weight: 700; }
  .lead-name { font-size: 11px; color: var(--ink-soft); margin-top: 1px; }
  .time { font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
  .interest { margin-top: 6px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.4; }
  .tags { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 999px;
    background: #EFE4CF;
    color: var(--gold-deep);
    font-weight: 600;
  }
  .tag.no-clid { background: #F2E1DC; color: var(--danger); }

  .actions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .btn {
    flex: 1 1 100%;
    border: none;
    border-radius: 8px;
    padding: 8px 8px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-primary { background: var(--gold); color: #fff; }
  .btn-primary:active { background: var(--gold-deep); }
  .btn-secondary { background: transparent; border: 1px solid var(--line); color: var(--ink-soft); flex: 1 1 auto; padding: 9px 6px; font-weight: 600; }
  select.btn-secondary { -webkit-appearance: none; appearance: none; }
  .btn-perdido { flex: 1 1 auto; }

  .refresh-note { text-align: center; font-size: 11px; color: var(--ink-soft); margin-top: 16px; }

  /* Lista */
  .list-view { display: flex; flex-direction: column; gap: 8px; }
  .list-row {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    cursor: pointer;
  }
  .list-row:active { background: #F4EBDB; }
  .list-row .info { min-width: 0; flex: 1; }
  .list-row .info .top-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .list-row .info .top-line .nome { font-weight: 700; font-size: 13.5px; }
  .list-row .info .top-line .tel { font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; }
  .list-row .info .interesse {
    font-size: 12px; color: var(--ink-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
  }
  .list-row .side { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .stage-pill { font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 999px; text-transform: uppercase; white-space: nowrap; }
  .stage-novo { background: #EFE4CF; color: #8C6420; }
  .stage-em_conversa { background: #E4D3B0; color: #6B4E12; }
  .stage-aguardando_agenda { background: #E0C9E0; color: #6B2E6B; }
  .stage-agendado { background: #E7D8A6; color: #7A5E00; }
  .stage-compareceu { background: #D9E7CF; color: #3F6B2E; }
  .stage-venda { background: #CFE7CF; color: #2E6B34; }
  .stage-perdido { background: #F2D7C9; color: #A4442E; }

  /* Chat */
  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 13px;
    opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .chat-panel {
    position: fixed; left: 0; right: 0; bottom: 0; height: 62vh; max-height: 560px;
    background: var(--paper); border-top: 1px solid var(--line); box-shadow: 0 -6px 24px rgba(0,0,0,0.15);
    transform: translateY(100%); transition: transform 0.25s ease; z-index: 50;
    display: flex; flex-direction: column;
  }
  .chat-panel.open { transform: translateY(0); }
  .chat-header { padding: 12px 16px; background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto; }
  .chat-header .who { display: flex; flex-direction: column; }
  .chat-header .who .name { font-weight: 700; font-size: 14px; }
  .chat-header .who .phone { font-size: 11px; opacity: 0.7; }
  .chat-header .close-btn { background: transparent; border: none; color: var(--bg); font-size: 20px; cursor: pointer; line-height: 1; padding: 4px 8px; }
  .chat-body { flex: 1; overflow-y: auto; padding: 14px; background: #EFE6D4; display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 78%; padding: 7px 11px; border-radius: 10px; font-size: 12.5px; line-height: 1.4; position: relative; }
  .bubble .meta { font-size: 10px; opacity: 0.55; margin-top: 3px; text-align: right; }
  .bubble.cliente { align-self: flex-start; background: #fff; color: #2B1B12; border-bottom-left-radius: 2px; }
  .bubble.bot { align-self: flex-end; background: #D8C9A3; color: #2B1B12; border-bottom-right-radius: 2px; }
  .bubble.humano { align-self: flex-end; background: var(--gold); color: #fff; border-bottom-right-radius: 2px; }
  .bubble .tag-remetente { font-size: 9px; font-weight: 700; text-transform: uppercase; opacity: 0.6; display: block; margin-bottom: 2px; }
  .chat-input-row { flex: 0 0 auto; padding: 10px 12px; background: var(--paper); border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .chat-input-row textarea { flex: 1; border: 1px solid var(--line); border-radius: 20px; padding: 10px 16px; font-size: 14px; resize: none; max-height: 80px; font-family: inherit; }
  .chat-send-btn { background: var(--gold); color: #fff; border: none; border-radius: 50%; width: 42px; height: 42px; flex: 0 0 auto; font-size: 16px; cursor: pointer; }
  .chat-send-btn:disabled { opacity: 0.5; }

  /* Dashboard */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 0 0 14px; }
  .filter-btn {
    background: var(--paper); border: 1px solid var(--line); color: var(--ink-soft);
    padding: 7px 14px; border-radius: 999px; font-size: 13px; cursor: pointer; font-weight: 600;
  }
  .filter-btn.active { background: var(--gold); border-color: var(--gold); color: #fff; }
  .filter-btn.small-filter { font-size: 11px; padding: 5px 10px; }
  .filter-custom { display: flex; align-items: center; gap: 6px; margin-left: 4px; }
  .filter-custom input { background: var(--paper); border: 1px solid var(--line); color: var(--ink); padding: 6px 8px; border-radius: 8px; font-size: 13px; }
  .filter-custom span { color: var(--ink-soft); font-size: 12px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .kpi { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .kpi .value { font-size: 20px; font-weight: 800; color: var(--gold-deep); }
  .kpi .label { font-size: 10.5px; color: var(--ink-soft); margin-top: 2px; line-height: 1.25; }
  .kpi.danger .value { color: var(--danger); }
  .kpi.success .value { color: var(--success); }

  .section { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft); margin: 0 0 10px; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 760px) { .grid-2 { grid-template-columns: 1fr; } }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; min-width: 480px; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--ink-soft); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 10.5px; text-transform: uppercase; white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  tr:last-child td { border-bottom: none; }
  @media (max-width: 480px) {
    table { min-width: 420px; font-size: 11.5px; }
    th { font-size: 9.5px; padding: 6px 8px; }
    td { font-size: 11px; padding: 7px 8px; }
  }
  canvas { max-height: 200px; }
  .chart-wrap { max-width: 260px; margin: 0 auto; }

  /* Lista de leads parados (cards, evita texto encavalado) */
  .parado-row {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .parado-row .info { min-width: 0; flex: 1 1 auto; }
  .parado-row .info .nome { font-weight: 700; font-size: 13px; }
  .parado-row .info .meta { font-size: 11px; color: var(--ink-soft); margin-top: 1px; }
  .parado-row .side { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="brand">Sofist Laser <small>PAINEL</small></div>
  <div class="attendant-row">
    <input id="attendantName" type="text" placeholder="Seu nome (pra registrar quem mudou)" />
  </div>
  <div class="main-tabs">
    <button class="main-tab active" id="mainTabFunil" onclick="mudarAba('funil')">Funil</button>
    <button class="main-tab" id="mainTabDashboard" onclick="mudarAba('dashboard')">Dashboard</button>
    <button class="main-tab" id="mainTabTrafego" onclick="mudarAba('trafego')">Tráfego Pago</button>
  </div>
</header>

<!-- ABA FUNIL -->
<div id="abaFunil">
  <div class="view-toggle">
    <button class="view-btn" id="btnViewKanban" onclick="mudarVisualizacao('kanban')">▦ Kanban</button>
    <button class="view-btn active" id="btnViewLista" onclick="mudarVisualizacao('lista')">☰ Lista</button>
  </div>
  <main id="mainFunil">
    <div class="empty">Carregando leads…</div>
  </main>
</div>

<!-- FILTROS COMPARTILHADOS (Dashboard + Tráfego Pago) -->
<div id="filtrosGlobais" class="hidden" style="padding:14px 14px 0;">
  <div class="filters" id="filters">
    <select id="filtroMes" class="filter-btn" style="font-weight:700;"></select>
    <button class="filter-btn small-filter" data-range="hoje">Hoje</button>
    <button class="filter-btn small-filter" data-range="ontem">Ontem</button>
    <button class="filter-btn small-filter" data-range="7">7 dias</button>
    <button class="filter-btn small-filter" data-range="14">14 dias</button>
    <button class="filter-btn small-filter" data-range="30">30 dias</button>
    <div class="filter-custom">
      <span>de</span>
      <input type="date" id="dataDe">
      <span>até</span>
      <input type="date" id="dataAte">
      <button class="filter-btn small-filter" id="btnCustom">Aplicar</button>
    </div>
  </div>
</div>

<!-- ABA DASHBOARD -->
<div id="abaDashboard" class="hidden">
  <main>
    <div id="mainDashboard">
      <div class="empty">Carregando dados…</div>
    </div>
  </main>
</div>

<!-- ABA TRÁFEGO PAGO -->
<div id="abaTrafego" class="hidden">
  <main>
    <div id="mainTrafego">
      <div class="empty">Carregando dados…</div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<div class="chat-panel" id="chatPanel">
  <div class="chat-header">
    <div class="who">
      <div class="name" id="chatNome">—</div>
      <div class="phone" id="chatTelefone">—</div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="close-btn" style="font-size:11px; border:1px solid rgba(255,255,255,0.3); border-radius:6px; padding:5px 10px;" onclick="devolverParaIA()">🤖 Devolver pra IA</button>
      <button class="close-btn" onclick="fecharChat()">✕</button>
    </div>
  </div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-input-row">
    <textarea id="chatInput" rows="1" placeholder="Digite sua resposta…"></textarea>
    <button class="chat-send-btn" id="chatSendBtn" onclick="enviarResposta()">➤</button>
  </div>
</div>

<script>
  const API_BASE = 'https://vmais.app.n8n.cloud/webhook';
  const SLUG = new URLSearchParams(location.search).get('slug') || 'sofist-laser';

  const STAGES = [
    { id: 'novo', label: 'Novo' },
    { id: 'em_conversa', label: 'Em conversa' },
    { id: 'aguardando_agenda', label: 'Aguardando agenda' },
    { id: 'agendado', label: 'Agendado' },
    { id: 'compareceu', label: 'Compareceu' },
    { id: 'venda', label: 'Venda' },
    { id: 'perdido', label: 'Perdido' }
  ];
  const NEXT_STAGE = { novo: 'em_conversa', em_conversa: 'aguardando_agenda', aguardando_agenda: 'agendado', agendado: 'compareceu', compareceu: 'venda' };

  let leads = [];
  let leadAberto = null;
  let modoVisualizacao = 'lista';
  let abaAtiva = 'funil';
  let funilChart = null;

  // ---------- Helpers compartilhados ----------
  const attendantInput = document.getElementById('attendantName');
  attendantInput.value = localStorage.getItem('funil_attendant_name') || '';
  attendantInput.addEventListener('input', () => localStorage.setItem('funil_attendant_name', attendantInput.value));

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function formatPhone(p) {
    if (!p) return 'Sem telefone';
    const d = p.replace(/\D/g, '');
    if (d.length === 13) return '(' + d.slice(2, 4) + ') ' + d.slice(4, 9) + '-' + d.slice(9);
    if (d.length === 12) return '(' + d.slice(2, 4) + ') ' + d.slice(4, 8) + '-' + d.slice(8);
    return p;
  }

  function timeAgo(iso) {
    if (!iso) return '';
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'agora';
    if (mins < 60) return mins + 'min';
    const hours = Math.floor(mins / 60);
    if (hours < 24) return hours + 'h';
    return Math.floor(hours / 24) + 'd';
  }

  function leadDisplay(lead) {
    const tel = formatPhone(lead.telefone);
    if (lead.nome) return escapeHtml(lead.nome) + ' (' + tel + ')';
    return tel;
  }

  function lastActivityIso(lead) {
    const hist = Array.isArray(lead.historico_conversa) ? lead.historico_conversa : [];
    if (hist.length > 0) return hist[hist.length - 1].timestamp;
    return lead.etapa_atualizada_em || lead.data_hora;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ---------- Abas principais ----------
  function mudarAba(aba) {
    abaAtiva = aba;
    document.getElementById('mainTabFunil').classList.toggle('active', aba === 'funil');
    document.getElementById('mainTabDashboard').classList.toggle('active', aba === 'dashboard');
    document.getElementById('mainTabTrafego').classList.toggle('active', aba === 'trafego');
    document.getElementById('abaFunil').classList.toggle('hidden', aba !== 'funil');
    document.getElementById('abaDashboard').classList.toggle('hidden', aba !== 'dashboard');
    document.getElementById('abaTrafego').classList.toggle('hidden', aba !== 'trafego');
    document.getElementById('filtrosGlobais').classList.toggle('hidden', aba === 'funil');
    if (aba === 'dashboard') renderDashboard();
    if (aba === 'trafego') renderTrafego();
  }

  function mudarVisualizacao(modo) {
    modoVisualizacao = modo;
    document.getElementById('btnViewKanban').classList.toggle('active', modo === 'kanban');
    document.getElementById('btnViewLista').classList.toggle('active', modo === 'lista');
    renderConteudoFunil();
  }

  // ================= FUNIL =================
  function renderConteudoFunil() {
    if (modoVisualizacao === 'lista') renderListView(); else renderBoard();
  }

  function buildCard(lead) {
    const card = document.createElement('div');
    card.className = 'card clicavel';
    card.onclick = (e) => { if (e.target.closest('.actions')) return; abrirChat(lead); };

    const hasClid = !!lead.ctwa_clid;
    const currentStage = lead.etapa_funil || 'novo';
    const nextStage = NEXT_STAGE[currentStage];
    const nextLabel = STAGES.find(s => s.id === nextStage);

    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="phone">${leadDisplay(lead)}</div>
        </div>
        <div class="time">${timeAgo(lead.data_hora)}</div>
      </div>
      ${lead.produto_interesse ? '<div class="interest">' + escapeHtml(lead.produto_interesse) + '</div>' : ''}
      <div class="tags">
        <span class="tag ${hasClid ? '' : 'no-clid'}">${hasClid ? 'Veio de anúncio' : 'Sem origem rastreada'}</span>
        ${lead.atendimento_modo === 'humano' ? '<span class="tag" style="background:#F2D7C9;color:#A4442E;">🔔 Aguardando você</span>' : ''}
      </div>
      <div class="actions"></div>
    `;

    const actions = card.querySelector('.actions');
    if (nextLabel) {
      const btn = document.createElement('button');
      btn.className = 'btn btn-primary';
      btn.textContent = 'Mover para ' + nextLabel.label.toLowerCase();
      btn.onclick = () => updateStage(lead.id, nextStage);
      actions.appendChild(btn);
    }
    if (currentStage !== 'venda' && currentStage !== 'perdido') {
      const perdidoBtn = document.createElement('button');
      perdidoBtn.className = 'btn btn-perdido';
      perdidoBtn.textContent = 'Perdido';
      perdidoBtn.onclick = () => updateStage(lead.id, 'perdido');
      actions.appendChild(perdidoBtn);
    }
    const moveSelect = document.createElement('select');
    moveSelect.className = 'btn btn-secondary';
    moveSelect.innerHTML = '<option value="">Mover p/…</option>' +
      STAGES.filter(s => s.id !== currentStage).map(s => `<option value="${s.id}">${s.label}</option>`).join('');
    moveSelect.onchange = () => { if (moveSelect.value) updateStage(lead.id, moveSelect.value); };
    actions.appendChild(moveSelect);

    return card;
  }

  function renderBoard() {
    const main = document.getElementById('mainFunil');
    main.innerHTML = '';
    const board = document.createElement('div');
    board.className = 'board';

    STAGES.forEach(stage => {
      const leadsDaColuna = leads.filter(l => (l.etapa_funil || 'novo') === stage.id)
        .sort((a, b) => new Date(b.data_hora) - new Date(a.data_hora));
      const column = document.createElement('div');
      column.className = 'column';
      column.innerHTML = `
        <div class="column-header"><span class="name">${stage.label}</span><span class="count">${leadsDaColuna.length}</span></div>
        <div class="column-body"></div>
      `;
      const body = column.querySelector('.column-body');
      if (leadsDaColuna.length === 0) {
        body.innerHTML = '<div class="column-empty">Nenhum lead aqui</div>';
      } else {
        leadsDaColuna.forEach(lead => body.appendChild(buildCard(lead)));
      }
      board.appendChild(column);
    });

    main.appendChild(board);
    const note = document.createElement('div');
    note.className = 'refresh-note';
    note.textContent = 'Atualiza sozinho a cada 30s · arraste o quadro pros lados pra ver todas as etapas';
    main.appendChild(note);
  }

  function lastActivityList(lead) { return new Date(lastActivityIso(lead)).getTime() || 0; }

  function renderListView() {
    const main = document.getElementById('mainFunil');
    if (leads.length === 0) { main.innerHTML = '<div class="empty">Nenhum lead ainda.</div>'; return; }
    const ordenados = [...leads].sort((a, b) => lastActivityList(b) - lastActivityList(a));

    const linhas = ordenados.map(lead => {
      const stage = lead.etapa_funil || 'novo';
      const label = STAGES.find(s => s.id === stage);
      return `
        <div class="list-row" data-lead-id="${lead.id}">
          <div class="info">
            <div class="top-line">
              <span class="nome">${leadDisplay(lead)}</span>
            </div>
            ${lead.produto_interesse ? '<div class="interesse">' + escapeHtml(lead.produto_interesse) + '</div>' : ''}
          </div>
          <div class="side">
            ${lead.atendimento_modo === 'humano' ? '<span class="tag" style="background:#F2D7C9;color:#A4442E;">🔔</span>' : ''}
            <span class="time">${timeAgo(lastActivityIso(lead))}</span>
            <span class="stage-pill stage-${stage}">${label ? label.label : stage}</span>
          </div>
        </div>
      `;
    }).join('');

    main.innerHTML = '<div class="list-view">' + linhas + '</div>';
    main.querySelectorAll('.list-row').forEach(row => {
      row.addEventListener('click', () => {
        const lead = leads.find(l => l.id === Number(row.dataset.leadId));
        if (lead) abrirChat(lead);
      });
    });
  }

  async function updateStage(leadId, novaEtapa) {
    const alteradoPor = attendantInput.value.trim() || 'Não informado';
    try {
      const res = await fetch(API_BASE + '/funil-atualizar-etapa', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lead_id: leadId, nova_etapa: novaEtapa, alterado_por: alteradoPor })
      });
      if (!res.ok) throw new Error('Falha ao atualizar');
      const lead = leads.find(l => l.id === leadId);
      if (lead) lead.etapa_funil = novaEtapa;
      showToast('Movido para ' + (STAGES.find(s => s.id === novaEtapa) || {}).label);
      renderConteudoFunil();
    } catch (err) {
      showToast('Erro ao salvar — tenta de novo');
    }
  }

  // ---------- Chat ----------
  function nomeRemetente(role) {
    if (role === 'user') return 'cliente';
    if (role === 'humano') return 'você';
    return 'Sofia (IA)';
  }
  function horaCurta(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }
  function renderChatBody() {
    const body = document.getElementById('chatBody');
    const lead = leads.find(l => l.id === leadAberto);
    if (!lead) return;
    const hist = Array.isArray(lead.historico_conversa) ? lead.historico_conversa : [];
    if (hist.length === 0) { body.innerHTML = '<div class="empty" style="color:#8a7554;">Nenhuma mensagem ainda.</div>'; return; }
    body.innerHTML = hist.map(m => {
      const classe = m.role === 'user' ? 'cliente' : (m.role === 'humano' ? 'humano' : 'bot');
      return `<div class="bubble ${classe}"><span class="tag-remetente">${nomeRemetente(m.role)}</span>${escapeHtml(m.content)}<div class="meta">${horaCurta(m.timestamp)}</div></div>`;
    }).join('');
    body.scrollTop = body.scrollHeight;
  }
  function abrirChat(lead) {
    leadAberto = lead.id;
    document.getElementById('chatNome').textContent = lead.nome || formatPhone(lead.telefone);
    document.getElementById('chatTelefone').textContent = lead.nome ? formatPhone(lead.telefone) : '';
    document.getElementById('chatPanel').classList.add('open');
    renderChatBody();
  }
  function fecharChat() {
    leadAberto = null;
    document.getElementById('chatPanel').classList.remove('open');
  }
  async function enviarResposta() {
    const input = document.getElementById('chatInput');
    const texto = input.value.trim();
    if (!texto || !leadAberto) return;
    const lead = leads.find(l => l.id === leadAberto);
    if (!lead) return;
    const btn = document.getElementById('chatSendBtn');
    btn.disabled = true;
    try {
      const res = await fetch(API_BASE + '/funil-responder-humano', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug: SLUG, lead_id: lead.id, telefone: lead.telefone, mensagem: texto })
      });
      if (!res.ok) throw new Error('Falha ao enviar');
      if (!Array.isArray(lead.historico_conversa)) lead.historico_conversa = [];
      lead.historico_conversa.push({ role: 'humano', content: texto, timestamp: new Date().toISOString() });
      lead.atendimento_modo = 'humano';
      input.value = '';
      renderChatBody();
      renderConteudoFunil();
    } catch (err) {
      showToast('Erro ao enviar — tenta de novo');
    } finally {
      btn.disabled = false;
    }
  }
  async function devolverParaIA() {
    if (!leadAberto) return;
    const lead = leads.find(l => l.id === leadAberto);
    if (!lead) return;
    try {
      const res = await fetch(API_BASE + '/funil-devolver-ia', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lead_id: lead.id })
      });
      if (!res.ok) throw new Error('Falha');
      lead.atendimento_modo = 'bot';
      showToast('Devolvido pra Sofia 🤖');
      renderConteudoFunil();
    } catch (err) {
      showToast('Erro ao devolver — tenta de novo');
    }
  }
  document.getElementById('chatInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarResposta(); }
  });

  // ================= DASHBOARD =================
  const STAGE_LABELS = Object.fromEntries(STAGES.map(s => [s.id, s.label]));
  const STAGE_ORDER = STAGES.map(s => s.id);

  function hoursSince(date) { return (Date.now() - date.getTime()) / (1000 * 60 * 60); }
  function formatHours(h) {
    if (h < 1) return Math.round(h * 60) + 'min';
    if (h < 24) return Math.round(h) + 'h';
    return Math.round(h / 24) + 'd';
  }

  function getRange(preset) {
    const now = new Date();
    const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0);
    const endOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59, 59);
    if (preset === 'hoje') return { from: startOfDay(now), to: endOfDay(now) };
    if (preset === 'ontem') {
      const y = new Date(now); y.setDate(y.getDate() - 1);
      return { from: startOfDay(y), to: endOfDay(y) };
    }
    const days = parseInt(preset, 10);
    const from = new Date(now); from.setDate(from.getDate() - days);
    return { from: startOfDay(from), to: endOfDay(now) };
  }
  let currentRange = getRange('7');

  function filteredLeadsDash() {
    return leads.filter(l => {
      const d = new Date(l.data_hora);
      return d >= currentRange.from && d <= currentRange.to;
    });
  }

  function renderDashboard() {
    const filtrados = filteredLeadsDash();
    const main = document.getElementById('mainDashboard');
    if (filtrados.length === 0) { main.innerHTML = '<div class="empty">Nenhum lead nesse período.</div>'; return; }

    const total = filtrados.length;
    const vendas = filtrados.filter(l => l.etapa_funil === 'venda').length;
    const perdidos = filtrados.filter(l => l.etapa_funil === 'perdido').length;
    const aguardandoAgenda = filtrados.filter(l => l.etapa_funil === 'aguardando_agenda').length;
    const comOrigem = filtrados.filter(l => l.ctwa_clid).length;
    const taxaConversao = total ? Math.round((vendas / total) * 100) : 0;

    const parados = filtrados
      .filter(l => l.etapa_funil !== 'venda' && l.etapa_funil !== 'perdido')
      .map(l => ({ lead: l, horas: hoursSince(new Date(lastActivityIso(l))) }))
      .filter(x => x.horas >= 1)
      .sort((a, b) => b.horas - a.horas);

    main.innerHTML = `
      <div class="kpis">
        <div class="kpi"><div class="value">${total}</div><div class="label">Leads no período</div></div>
        <div class="kpi success"><div class="value">${vendas}</div><div class="label">Vendas</div></div>
        <div class="kpi danger"><div class="value">${perdidos}</div><div class="label">Perdidos</div></div>
        <div class="kpi"><div class="value">${taxaConversao}%</div><div class="label">Taxa de conversão</div></div>
        <div class="kpi"><div class="value">${comOrigem}/${total}</div><div class="label">Com origem rastreada</div></div>
        <div class="kpi"><div class="value">${aguardandoAgenda}</div><div class="label">Aguardando agenda</div></div>
      </div>
      <div class="section">
        <h2>Leads por etapa <span style="text-transform:none; font-weight:400; opacity:0.7;">(toque numa etapa pra ver os leads)</span></h2>
        <canvas id="chartFunil" style="max-width:260px; margin:0 auto; display:block;"></canvas>
        <div class="stage-clicaveis" id="stageClicaveis" style="margin-top:10px; display:flex; flex-wrap:wrap; gap:6px;"></div>
        <div id="listaEtapaSelecionada" style="margin-top:12px;"></div>
      </div>
      <div class="section"><h2>Leads parados / esfriando (sem venda ou perda)</h2><div id="tabelaParados"></div></div>
    `;

    renderFunilChart(filtrados);
    renderStageClicaveis(filtrados);
    renderParadosTable(parados);
  }

  function renderFunilChart(filtrados) {
    const counts = STAGE_ORDER.map(s => filtrados.filter(l => (l.etapa_funil || 'novo') === s).length);
    const ctx = document.getElementById('chartFunil');
    if (funilChart) funilChart.destroy();
    funilChart = new Chart(ctx, {
      type: 'pie',
      data: { labels: STAGE_ORDER.map(s => STAGE_LABELS[s]), datasets: [{
        data: counts,
        backgroundColor: ['#C9B383', '#B9862E', '#8f5f8f', '#D8B04A', '#7FAE6B', '#4C6B47', '#A4442E']
      }] },
      options: {
        maintainAspectRatio: true,
        aspectRatio: 1.3,
        onClick: (evt, elements) => {
          if (elements.length > 0) mostrarLeadsDaEtapa(STAGE_ORDER[elements[0].index], filtrados);
        },
        plugins: {
          legend: { position: 'bottom', labels: { color: '#6B5A4E', font: { size: 10 }, boxWidth: 10, padding: 8 } }
        }
      }
    });
  }

  function renderStageClicaveis(filtrados) {
    const container = document.getElementById('stageClicaveis');
    container.innerHTML = STAGES.map(s => {
      const qtd = filtrados.filter(l => (l.etapa_funil || 'novo') === s.id).length;
      return `<button class="filter-btn" data-stage="${s.id}" style="font-size:11px; padding:5px 10px;">${s.label} (${qtd})</button>`;
    }).join('');
    container.querySelectorAll('button[data-stage]').forEach(btn => {
      btn.addEventListener('click', () => mostrarLeadsDaEtapa(btn.dataset.stage, filtrados));
    });
  }

  function mostrarLeadsDaEtapa(etapa, filtrados) {
    const container = document.getElementById('listaEtapaSelecionada');
    const daEtapa = filtrados.filter(l => (l.etapa_funil || 'novo') === etapa)
      .sort((a, b) => lastActivityList(b) - lastActivityList(a));
    const label = STAGES.find(s => s.id === etapa);

    if (daEtapa.length === 0) {
      container.innerHTML = `<div class="empty">Nenhum lead em "${label ? label.label : etapa}" nesse período.</div>`;
      return;
    }

    const linhas = daEtapa.map(l => `
      <tr>
        <td>${leadDisplay(l)}</td>
        <td>${escapeHtml(l.produto_interesse) || '—'}</td>
        <td>${timeAgo(lastActivityIso(l))}</td>
      </tr>
    `).join('');

    container.innerHTML = `
      <div style="font-weight:700; font-size:12.5px; margin-bottom:6px; color:var(--gold-deep);">${label ? label.label : etapa} (${daEtapa.length})</div>
      <div class="table-wrap"><table><tr><th>Lead</th><th>Interesse</th><th>Última atividade</th></tr>${linhas}</table></div>
    `;
  }

  function renderProcedimentoTable(filtrados) {
    const grupos = {};
    filtrados.forEach(l => {
      const key = l.produto_interesse || 'Não identificado';
      if (!grupos[key]) grupos[key] = { total: 0, venda: 0, perdido: 0 };
      grupos[key].total++;
      if (l.etapa_funil === 'venda') grupos[key].venda++;
      if (l.etapa_funil === 'perdido') grupos[key].perdido++;
    });
    const linhas = Object.entries(grupos).sort((a, b) => b[1].total - a[1].total)
      .map(([nome, g]) => `<tr><td>${escapeHtml(nome)}</td><td>${g.total}</td><td style="color:var(--success)">${g.venda}</td><td style="color:var(--danger)">${g.perdido}</td></tr>`)
      .join('');
    document.getElementById('tabelaProcedimento').innerHTML = `<div class="table-wrap"><table><tr><th>Procedimento</th><th>Leads</th><th>Vendas</th><th>Perdidos</th></tr>${linhas}</table></div>`;
  }

  function renderParadosTable(parados) {
    const container = document.getElementById('tabelaParados');
    if (parados.length === 0) { container.innerHTML = '<div class="empty">Nada parado agora — tudo em dia 🎉</div>'; return; }
    const linhas = parados.slice(0, 30).map(({ lead, horas }) => {
      let tagClass = 'stage-novo', tagText = formatHours(horas);
      if (horas >= 24) { tagClass = 'stage-perdido'; tagText = formatHours(horas) + ' parado'; }
      else if (horas >= 3) { tagClass = 'stage-agendado'; tagText = formatHours(horas) + ' parado'; }
      return `
        <div class="parado-row">
          <div class="info">
            <div class="nome">${leadDisplay(lead)}</div>
            <div class="meta">${STAGE_LABELS[lead.etapa_funil || 'novo']} · ${lead.atendimento_modo === 'humano' ? 'Aguardando você' : 'Bot'}</div>
          </div>
          <div class="side"><span class="stage-pill ${tagClass}">${tagText}</span></div>
        </div>
      `;
    }).join('');
    container.innerHTML = linhas;
  }

  document.querySelectorAll('.filter-btn[data-range]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn[data-range]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRange = getRange(btn.dataset.range);
      if (abaAtiva === 'dashboard') renderDashboard();
      if (abaAtiva === 'trafego') renderTrafego();
    });
  });
  document.getElementById('btnCustom').addEventListener('click', () => {
    const de = document.getElementById('dataDe').value;
    const ate = document.getElementById('dataAte').value;
    if (!de || !ate) return;
    document.querySelectorAll('.filter-btn[data-range]').forEach(b => b.classList.remove('active'));
    currentRange = { from: new Date(de + 'T00:00:00'), to: new Date(ate + 'T23:59:59') };
    if (abaAtiva === 'dashboard') renderDashboard();
    if (abaAtiva === 'trafego') renderTrafego();
  });

  let mesFiltroInicializado = false;
  const NOMES_MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  function aplicarFiltroMes(valor) {
    const [ano, mes] = valor.split('-').map(Number);
    currentRange = { from: new Date(ano, mes - 1, 1, 0, 0, 0), to: new Date(ano, mes, 0, 23, 59, 59) };
    document.querySelectorAll('.filter-btn[data-range]').forEach(b => b.classList.remove('active'));
  }

  function popularFiltroMeses() {
    const select = document.getElementById('filtroMes');
    if (leads.length === 0) return;
    const datas = leads.map(l => new Date(l.data_hora)).filter(d => !isNaN(d));
    if (datas.length === 0) return;
    const min = new Date(Math.min(...datas));
    const max = new Date(Math.max(...datas));
    const opcoes = [];
    let y = min.getFullYear(), m = min.getMonth();
    const yEnd = max.getFullYear(), mEnd = max.getMonth();
    while (y < yEnd || (y === yEnd && m <= mEnd)) {
      const valor = y + '-' + String(m + 1).padStart(2, '0');
      opcoes.push({ valor, label: NOMES_MESES[m] + '/' + y });
      m++;
      if (m > 11) { m = 0; y++; }
    }
    const valorAnterior = select.value;
    select.innerHTML = opcoes.map(o => `<option value="${o.valor}">${o.label}</option>`).join('');

    if (!mesFiltroInicializado) {
      const hoje = new Date();
      const mesAtualValor = hoje.getFullYear() + '-' + String(hoje.getMonth() + 1).padStart(2, '0');
      const alvo = opcoes.find(o => o.valor === mesAtualValor) ? mesAtualValor : opcoes[opcoes.length - 1].valor;
      select.value = alvo;
      aplicarFiltroMes(alvo);
      mesFiltroInicializado = true;
    } else if (valorAnterior) {
      select.value = valorAnterior;
    }
  }

  document.getElementById('filtroMes').addEventListener('change', (e) => {
    aplicarFiltroMes(e.target.value);
    if (abaAtiva === 'dashboard') renderDashboard();
    if (abaAtiva === 'trafego') renderTrafego();
  });
  function classificarTrafego(lead) {
    const etapa = lead.etapa_funil || 'novo';
    if (etapa === 'perdido') return 'negaram';
    if (['venda', 'compareceu', 'agendado', 'aguardando_agenda'].includes(etapa)) return 'avancou';
    const hist = Array.isArray(lead.historico_conversa) ? lead.historico_conversa : [];
    if (hist.length === 0 || etapa === 'novo') return 'primeiro_atendimento';
    const ultima = hist[hist.length - 1];
    if (ultima.role === 'user') return 'aguardando_resposta_nossa';
    const mencionouPrecoEmAlgumMomento = hist.some(m => m.role !== 'user' && /R\$\s?\d/.test(m.content || ''));
    return mencionouPrecoEmAlgumMomento ? 'parou_na_oferta' : 'nao_respondeu_mais';
  }

  function renderTrafego() {
    const filtrados = filteredLeadsDash();
    const main = document.getElementById('mainTrafego');
    if (filtrados.length === 0) { main.innerHTML = '<div class="empty">Nenhum lead nesse período.</div>'; return; }

    const buckets = { entraram: filtrados.length, primeiro_atendimento: 0, parou_na_oferta: 0, nao_respondeu_mais: 0, negaram: 0, avancou: 0, aguardando_resposta_nossa: 0 };
    const listasPorBucket = { primeiro_atendimento: [], parou_na_oferta: [], nao_respondeu_mais: [], negaram: [] };

    filtrados.forEach(l => {
      const c = classificarTrafego(l);
      buckets[c] = (buckets[c] || 0) + 1;
      if (listasPorBucket[c]) listasPorBucket[c].push(l);
    });

    main.innerHTML = `
      <div class="kpis">
        <div class="kpi"><div class="value">${buckets.entraram}</div><div class="label">Leads que entraram</div></div>
        <div class="kpi clicavel-kpi" data-target="grupo-primeiro_atendimento"><div class="value">${buckets.primeiro_atendimento}</div><div class="label">Pararam no 1º atendimento</div></div>
        <div class="kpi danger clicavel-kpi" data-target="grupo-parou_na_oferta"><div class="value">${buckets.parou_na_oferta}</div><div class="label">Pararam ao receber oferta/valor</div></div>
        <div class="kpi danger clicavel-kpi" data-target="grupo-nao_respondeu_mais"><div class="value">${buckets.nao_respondeu_mais}</div><div class="label">Não responderam mais</div></div>
        <div class="kpi danger clicavel-kpi" data-target="grupo-negaram"><div class="value">${buckets.negaram}</div><div class="label">Negaram / perdidos</div></div>
      </div>
      <div class="section">
        <h2>Por procedimento de interesse</h2>
        <div id="tabelaProcedimento"></div>
      </div>
      <div class="section">
        <h2>Detalhe por grupo <span style="text-transform:none; font-weight:400; opacity:0.7;">(toque num número acima pra pular direto)</span></h2>
        <div id="detalheTrafego"></div>
      </div>
      <div class="refresh-note">"Aguardando resposta nossa" (${buckets.aguardando_resposta_nossa}) e "Avançaram no funil" (${buckets.avancou}) não entram nesses números — são leads ativos, não parados.</div>
    `;

    document.querySelectorAll('.clicavel-kpi').forEach(el => {
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => {
        const alvo = document.getElementById(el.dataset.target);
        if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });

    renderProcedimentoTable(filtrados);
    renderDetalheTrafego(listasPorBucket);
  }

  function renderDetalheTrafego(listasPorBucket) {
    const grupos = [
      { chave: 'primeiro_atendimento', titulo: 'Pararam no 1º atendimento' },
      { chave: 'parou_na_oferta', titulo: 'Pararam ao receber oferta/valor' },
      { chave: 'nao_respondeu_mais', titulo: 'Não responderam mais' },
      { chave: 'negaram', titulo: 'Negaram / perdidos' }
    ];
    const html = grupos.map(g => {
      const itens = listasPorBucket[g.chave] || [];
      if (itens.length === 0) return '';
      const linhas = itens.map(l => `
        <tr>
          <td>${leadDisplay(l)}</td>
          <td>${escapeHtml(l.produto_interesse) || '—'}</td>
          <td>${timeAgo(lastActivityIso(l))}</td>
        </tr>
      `).join('');
      return `
        <div id="grupo-${g.chave}" style="margin-bottom:18px;">
          <div style="font-weight:700; font-size:12.5px; margin-bottom:6px; color:var(--gold-deep);">${g.titulo} (${itens.length})</div>
          <div class="table-wrap"><table><tr><th>Lead</th><th>Interesse</th><th>Última atividade</th></tr>${linhas}</table></div>
        </div>
      `;
    }).join('');
    document.getElementById('detalheTrafego').innerHTML = html || '<div class="empty">Nada parado nesse período 🎉</div>';
  }

  // ================= Carregamento de dados (compartilhado) =================
  async function loadLeads(showLoading) {
    if (showLoading) {
      document.getElementById('mainFunil').innerHTML = '<div class="empty">Carregando leads…</div>';
    }
    try {
      const res = await fetch(API_BASE + '/funil-leads?slug=' + encodeURIComponent(SLUG));
      if (!res.ok) throw new Error('Falha ao carregar');
      const data = await res.json();
      leads = data.leads || [];
      popularFiltroMeses();
      if (data.cliente && data.cliente.nome) {
        document.querySelector('header .brand').innerHTML = escapeHtml(data.cliente.nome) + ' <small>PAINEL</small>';
      }
      renderConteudoFunil();
      if (abaAtiva === 'dashboard') renderDashboard();
      if (abaAtiva === 'trafego') renderTrafego();
      if (leadAberto) renderChatBody();
    } catch (err) {
      document.getElementById('mainFunil').innerHTML = '<div class="empty">Não deu pra carregar os leads agora.<br>Puxa a tela pra tentar de novo.</div>';
    }
  }

  loadLeads(true);
  setInterval(() => loadLeads(false), 30000);
</script>

</body>
</html>
